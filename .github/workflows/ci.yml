name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gdb g++ nodejs
      - run: pip install -e packages/tracer-python -e packages/tracer-cpp -e packages/tracer-js -e packages/tracer-java -e 'packages/backend[dev]'
      - run: pytest --import-mode=importlib packages/tracer-python packages/tracer-cpp packages/tracer-js packages/tracer-java packages/backend -v

  node:
    name: Node (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@dsa-viz/trace-schema --workspace=@dsa-viz/visualizer-core
      - run: npm run test:js

  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: pip install ruff
      - run: npm ci
      - run: npm run lint

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y gdb g++ nodejs
      - run: pip install -e packages/tracer-python -e packages/tracer-cpp -e packages/tracer-js -e packages/tracer-java -e 'packages/backend[dev]'
      - run: npm ci
      - run: npm run build --workspace=@dsa-viz/trace-schema --workspace=@dsa-viz/visualizer-core
      - run: npx playwright install --with-deps chromium
        working-directory: packages/web-app
      - run: npm run test:e2e
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: packages/web-app/test-results/
          retention-days: 7

  extensions:
    name: M2 extension bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@dsa-viz/trace-schema --workspace=@dsa-viz/visualizer-core
      - run: npm run build --workspace=@dsa-viz/browser-extension
        env:
          EXTENSION_TEST_MATCH: "1"
      - run: npm run build --workspace=dsa-visualizer-vscode
      - run: npx playwright install --with-deps chromium
        working-directory: packages/browser-extension
      # xvfb-run provides a display so Chromium MV3 content scripts load.
      # Smoke test runs headless; the @persistent test needs a head.
      - run: xvfb-run -a npx playwright test --config=packages/browser-extension/playwright.config.ts

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t code-visualizer:ci .
      - name: Smoke test combined app
        run: |
          docker run --detach --name code-visualizer-ci \
            --env MAX_CHILD_PROCESSES=0 \
            --publish 8000:8000 \
            code-visualizer:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/healthz
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"language":"python","source":"values = [3, 1, 2]\nvalues.sort()\nprint(values)"}' \
            http://localhost:8000/trace |
            python3 -c 'import json,sys; trace=json.load(sys.stdin); assert trace["exit"]["status"] == "ok"; assert trace["events"]'
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"language":"cpp","source":"int main() {\n  int x = 2;\n  x += 3;\n  return x;\n}"}' \
            http://localhost:8000/trace |
            python3 -c 'import json,sys; trace=json.load(sys.stdin); assert trace["exit"]["status"] == "ok"; assert trace["events"]'
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"language":"javascript","source":"const x = 2;\nconst y = x + 3;"}' \
            http://localhost:8000/trace |
            python3 -c 'import json,sys; trace=json.load(sys.stdin); assert trace["exit"]["status"] == "ok"; assert trace["events"]'
      - if: always()
        run: docker rm --force code-visualizer-ci || true
