[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-tracer-js"
version = "0.1.0"
description = "JavaScript tracer for the DSA Code Visualizer — drives Node via V8 Inspector."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
